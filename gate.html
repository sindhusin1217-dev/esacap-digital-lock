<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>Join code · Escape the Digital Room</title>
<style>
  *,*::before,*::after{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
    background:
      radial-gradient(900px 620px at 12% -12%,rgba(34,211,238,.15),transparent 62%),
      radial-gradient(820px 560px at 50% 118%,rgba(139,92,246,.14),transparent 62%),
      #04060c;
    color:#e6edf7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  }
  .card{
    width:min(480px,100%);padding:clamp(24px,5vw,38px);
    border:1px solid rgba(148,163,184,.18);border-radius:22px;
    background:linear-gradient(180deg,rgba(17,26,43,.92),rgba(9,14,24,.94));
    box-shadow:0 30px 70px -30px #000;
  }
  .badge{
    width:54px;height:54px;display:grid;place-items:center;margin-bottom:18px;
    border-radius:14px;border:1px solid rgba(34,211,238,.4);background:rgba(34,211,238,.1);
    font-size:24px;
  }
  .eyebrow{
    margin:0 0 10px;font-family:ui-monospace,Consolas,monospace;font-size:.68rem;
    letter-spacing:.28em;text-transform:uppercase;color:#22d3ee;
  }
  h1{margin:0 0 12px;font-size:clamp(1.5rem,4vw,2rem);letter-spacing:-.02em}
  .sub{margin:0 0 22px;color:#8b9bb4;line-height:1.55;font-size:.95rem}
  form{display:flex;flex-direction:column;gap:12px}
  input{
    width:100%;padding:16px 18px;border-radius:14px;text-align:center;
    border:1px solid rgba(148,163,184,.25);background:rgba(148,163,184,.06);
    color:#fff;font-family:ui-monospace,Consolas,monospace;font-size:1.5rem;
    letter-spacing:.28em;text-transform:uppercase;outline:none;
  }
  input:focus{border-color:#22d3ee;box-shadow:0 0 0 3px rgba(34,211,238,.15)}
  button{
    padding:15px 20px;border-radius:14px;border:0;cursor:pointer;
    background:linear-gradient(90deg,#22d3ee,#34d399);color:#04121a;
    font-weight:800;font-size:1rem;font-family:inherit;
  }
  button:disabled{opacity:.6;cursor:wait}
  .msg{min-height:1.2em;margin:14px 0 0;font-size:.88rem;color:#fb7185}
  .msg.ok{color:#34d399}
  .note{margin:20px 0 0;color:#5b6b83;font-size:.76rem;line-height:1.6}
</style>
</head>
<body>
<main class="card">
  <div class="badge" aria-hidden="true">&#128274;</div>
  <p class="eyebrow">Escape the Digital Room</p>
  <h1>Enter the join code</h1>
  <p class="sub">Your teacher will show you a short code. Type it below to open the game.</p>
  <form id="form" autocomplete="off">
    <input id="code" name="code" maxlength="12" placeholder="CODE" autocapitalize="characters"
           autocorrect="off" spellcheck="false" autofocus aria-label="Join code" />
    <button id="go" type="submit">Open the game</button>
  </form>
  <p class="msg" id="msg" role="status"></p>
  <p class="note">The code is checked on the classroom computer. You only need to type it once per device.</p>
</main>
<script>
(function () {
  'use strict';
  var form = document.getElementById('form');
  var input = document.getElementById('code');
  var go = document.getElementById('go');
  var msg = document.getElementById('msg');

  input.addEventListener('input', function () {
    input.value = input.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    msg.textContent = '';
  });

  form.addEventListener('submit', function (event) {
    event.preventDefault();
    var code = (input.value || '').trim().toUpperCase();
    if (code.length < 4) {
      msg.textContent = 'Type the code from your teacher.';
      return;
    }
    go.disabled = true;
    msg.className = 'msg';
    msg.textContent = 'Checking...';
    fetch('/api/join', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: code })
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (data) {
        return { status: r.status, data: data };
      });
    }).then(function (res) {
      if (res.status === 200 && res.data && res.data.ok) {
        msg.className = 'msg ok';
        msg.textContent = 'Code accepted. Opening the game...';
        location.replace('/');
        return;
      }
      go.disabled = false;
      msg.className = 'msg';
      if (res.status === 429) {
        msg.textContent = 'Too many tries. Wait one minute and try again.';
      } else if (res.status === 401) {
        msg.textContent = 'Wrong code. Ask your teacher and try again.';
      } else {
        msg.textContent = 'Could not check the code. Open the link your teacher gave you.';
      }
      input.focus();
      input.select();
    }).catch(function () {
      go.disabled = false;
      msg.textContent = 'No connection. Check the internet and try again.';
    });
  });
})();
</script>
</body>
</html>
